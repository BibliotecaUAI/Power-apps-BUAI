                                              'Pregrado A - Existencia': If(d = "0", "0", Text(r.exA)),
                                              'Pregrado F - Existencia': If(d = "0", "0", Text(r.exF)),
                                              'Posgrado - Existencia': If(d = "0", "0", Text(r.exP)),
                                              'Viña - Existencia': If(d = "0", "0", Text(r.exV)),
                                              'Informar a Finanzas (SI/NO)': drpFinanzas_m.Selected.Value,
                                              'Forma de Adquisición': drpFormaAdq_m.Selected.Value,
                                              'Bibliografía de programas académicos (SI/NO)': drpBibliografia_m.Selected.Value,
